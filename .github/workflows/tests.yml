name: Tests

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Debug repository visibility
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Event reports private: $EVENT_PRIVATE"
          gh api "repos/$REPOSITORY" --jq '.private'
      - name: Tests
        uses: Yandex-Practicum/test-project-action@v1
        with:
          project: 'ono-tebe-nado-ad'
